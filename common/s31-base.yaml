# common/s31-base.yaml
#
# Shared ESPHome template for Sonoff S31 outlets.
# Each per-device YAML file references this via:
#
#   packages:
#     base: !include common/s31-base.yaml
#
# All variation between devices lives in the per-device file's
# `substitutions:` block. See ../outlet-template.yaml.example for the
# eight substitutions every device must supply.
#
# Documentation:
#   docs/installation.md     — hardware + flashing
#   docs/calibration.md      — how to set voltage_cal / current_cal / power_cal
#   docs/design-rationale.md — why each block is the way it is
#   docs/troubleshooting.md  — symptoms + fixes

# ── Device identity ──────────────────────────────────────────────
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

esp8266:
  board: esp12e                # 4 MB flash variant matches the S31
  early_pin_init: false        # prevent relay click during boot/OTA
  restore_from_flash: false    # state restore handled by switch.restore_mode
  framework:
    version: recommended       # pin SDK to ESPHome's curated stable

# ── Connectivity ─────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s           # don't reboot if AP is briefly gone
  min_auth_mode: WPA2          # silences forward-compat warning (2026.6.0)
  fast_connect: true           # cache BSSID/channel for fast reconnect
  power_save_mode: NONE        # mains-powered: prioritize responsiveness
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s           # don't reboot if HA is briefly down

ota:
  platform: esphome
  password: !secret ota_password

# ── Local web UI (monitoring/control only, no firmware upload) ───
# Auth is mandatory — the UI can toggle the relay even without OTA.
# This is HTTP basic over plain HTTP (no TLS on ESP8266); trusted LAN only.
web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

# ── Logging ──────────────────────────────────────────────────────
# baud_rate: 0 disables UART logging. The CSE7766 owns the UART RX
# line — if both try to use it, sensor readings become garbage.
logger:
  baud_rate: 0
  level: INFO
  logs:
    sensor: WARN               # suppress per-sample spam
    cse7766: WARN
    component: WARN

# ── CSE7766 power-meter UART link ────────────────────────────────
# Frame format dictated by the chip: 4800 baud, 8 data bits, EVEN
# parity, 1 stop bit. Don't change.
uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

time:
  - platform: sntp
    id: my_time

# ── User input: power-detection threshold ────────────────────────
# The "Active" binary sensor fires when power exceeds this value.
# restore_value: true preserves user-tuned values across reboots.
number:
  - platform: template
    name: "Power Threshold"
    id: power_threshold
    optimistic: true
    restore_value: true
    initial_value: ${threshold_default}
    min_value: 1
    max_value: 1800
    step: 1
    unit_of_measurement: W
    mode: box

# ── Binary sensors ───────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    on_press:
      - switch.toggle: relay

  - platform: status
    name: "Status"
    entity_category: diagnostic

  # "Active" detects whether a real load is running (power > threshold).
  # delayed_on/delayed_off act as a Schmitt trigger to ignore brief
  # cycling (compressors, kettle pre-heat pulses, etc.).
  - platform: template
    name: "Active"
    lambda: |-
      if (isnan(id(my_power).state)) return {};
      return id(my_power).state > id(power_threshold).state;
    filters:
      - delayed_on: 5s
      - delayed_off: 30s

# ── Power-meter sensors ──────────────────────────────────────────
# Filter ordering rule: multiply (calibration) FIRST, then NaN
# filtering, then sanity clamps, then time-based throttling. Filters
# compose like a Unix pipeline; downstream filters operate on
# upstream-cleaned values.
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: cse7766
    current:
      name: "Current"
      accuracy_decimals: 2
      filters:
        - multiply: ${current_cal}
        - filter_out: nan
        - throttle_average: 10s
        - or:
            - throttle: 60s
            - delta: 0.05
    voltage:
      name: "Voltage"
      accuracy_decimals: 1
      filters:
        - multiply: ${voltage_cal}
        - filter_out: nan
        - clamp:
            min_value: 80
            max_value: 280
        - throttle_average: 60s
    power:
      name: "Power"
      id: my_power
      accuracy_decimals: 2
      filters:
        - multiply: ${power_cal}
        - filter_out: nan
        - throttle_average: 10s
        - or:
            - throttle: 60s
            - delta: 5
    energy:
      name: "Energy"
      accuracy_decimals: 3
      filters:
        - throttle: 60s        # counter — sample, don't average
    apparent_power:
      name: "Apparent Power"
      filters:
        - filter_out: nan
        - throttle_average: 30s
    power_factor:
      name: "Power Factor"
      accuracy_decimals: 2
      filters:
        # Reject NaN (idle / no load) and physically-impossible values
        # (>1.0 or <0.0 from chip calibration mismatch). Inspects only
        # the local sample — no cross-sensor state lookup, no race.
        - lambda: |-
            if (isnan(x) || x < 0.0 || x > 1.0) return {};
            return x;
        - throttle_average: 60s

  - platform: total_daily_energy
    name: "Daily Energy"
    power_id: my_power
    accuracy_decimals: 3

# ── Diagnostic text sensors (off by default in HA) ───────────────
# entity_category: diagnostic puts these under HA's Diagnostic
# section instead of cluttering main dashboards.
# disabled_by_default: true keeps them out of the recorder until
# the user explicitly enables them (no DB bloat in steady state).
text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "SSID"
      entity_category: diagnostic
      disabled_by_default: true
    bssid:
      name: "BSSID"
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "MAC"
      entity_category: diagnostic
      disabled_by_default: true

# ── The actual relay ─────────────────────────────────────────────
# device_class: outlet improves HA UI rendering (outlet icon vs
# generic switch) and voice-assistant phrasing.
switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO12
    id: relay
    restore_mode: ${restore_mode}
    device_class: outlet

# ── Remote-recovery button ───────────────────────────────────────
button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

# ── Blue LED on the front of the S31 ─────────────────────────────
# ESPHome system status indicator: fast blink = no WiFi, slow blink
# = no API, solid = healthy.
status_led:
  pin:
    number: GPIO13
    inverted: true
